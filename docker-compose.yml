version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: watercrab-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: always

  browser:
    build:
      context: ./browser-service
      dockerfile: Dockerfile
    container_name: watercrab-browser
    ports:
      - '3002:3002'
    environment:
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set in the environment}
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: watercrab-api
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - BROWSER_SERVICE_URL=http://browser:3002
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set in the environment}
    depends_on:
      - redis
      - browser
    restart: always

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: watercrab-worker
    environment:
      - REDIS_URL=redis://redis:6379
      - BROWSER_SERVICE_URL=http://browser:3002
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set in the environment}
    depends_on:
      - redis
      - browser
    restart: always

volumes:
  redis_data:
